gh api \
  repos/abhirawatt786/trustarr/contents/.github/workflows/fun.yml \
  -X PUT \
  -F message='Add fun workflow' \
  -F content="$(base64 <<'EOF'
name: Trustarr Fun Commit
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Make a commit
        run: |
          echo "Ping from Copilot at $(date)" >> activity.log
          git config --global user.name "CopilotBot"
          git config --global user.email "you@example.com"
          git add activity.log
          git commit -m "Fun commit from Copilot"
          git push
EOF
)"
