name: Trustarr Fun Commit
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure Git
        run: |
          git config --global user.name "CopilotBot"
          git config --global user.email "you@example.com"

      - name: Make a commit
        run: |
          echo "Ping from Copilot at $(date)" >> activity.log
          git add activity.log
          git commit -m "Fun commit from Copilot" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
