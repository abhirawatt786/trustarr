name: Trustarr Fun Commit
on:
  workflow_dispatch:   # manual trigger button
  schedule:
    - cron: '0 12 * * *'  # runs daily at noon

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow pushing commits
    steps:
      - name: Checkout
        uses: actions/checkout@v4   # updated to Node.js 24 compatible

      - name: Configure Git
        run: |
          git config --global user.name "CopilotBot"
          git config --global user.email "you@example.com"

      - name: Make a commit
        run: |
          echo "Ping from Copilot at $(date)" >> activity.log
          git add activity.log
          git commit -m "Fun commit from Copilot" || echo "No changes to commit"

      - name: Push changes
        run: git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
